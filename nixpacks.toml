[phases.setup]
# Only the two interpreters. pip and npm deliberately aren't listed:
#
#   - npm ships inside nodejs_20.
#   - pip is bootstrapped by `python3 -m venv` below, so the venv's own pip is
#     what installs requirements.txt — the Nix-level one was never used.
#
# Both were previously requested as separate attributes (python311Packages.pip,
# nodePackages.npm). Those attributes have been removed or broken by nixpkgs
# churn, and when nixpacks bumped its pinned nixpkgs revision the setup phase
# started failing with `nix-env -if ... exit code 100` before any of our code
# was even copied into the image. Asking for less keeps this build off that
# treadmill.
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd frontend && npm ci --prefer-offline"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
# Absolute path for the same reason as railway.toml's startCommand (which
# overrides this one): gunicorn lives in the venv and /opt/venv/bin is not on
# PATH at start time. Kept in sync so a build driven by this file alone works.
cmd = "/opt/venv/bin/gunicorn -c gunicorn_config.py --bind 0.0.0.0:$PORT --workers 2 wsgi:app"
